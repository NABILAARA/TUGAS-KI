<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistem Nilai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center font-sans">

  <div class="w-full max-w-sm px-4">

    <!-- Logo & Judul -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gray-900 mb-4">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-gray-900">Sistem Nilai</h1>
      <p class="text-sm text-gray-500 mt-1">Zero Trust · Informatika Unsil</p>
    </div>

    <!-- Card Login -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <h2 class="text-base font-semibold text-gray-800 mb-6">Masuk ke akun Anda</h2>

      <!-- Error Message -->
      <div id="error-msg" class="hidden mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700"></div>

      <form id="login-form" class="space-y-4" autocomplete="off">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="username">Username</label>
          <input
            id="username"
            type="text"
            placeholder="Masukkan username"
            class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition"
            required
            autocomplete="off"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition"
            required
          />
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="w-full py-2.5 px-4 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-800 transition focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Masuk
        </button>
      </form>

      <!-- Device ID info -->
      <div class="mt-5 pt-4 border-t border-gray-100">
        <p class="text-xs text-gray-400 text-center">Device ID Anda</p>
        <p id="device-id-display" class="text-xs font-mono text-gray-500 text-center mt-0.5 break-all"></p>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      Tugas Praktikum — Keamanan Informasi KP70065004
    </p>
  </div>

  <script src="app.js"></script>
  <script>
    // Tampilkan device ID
    document.getElementById('device-id-display').textContent = getDeviceId();

    // Kalau sudah login, redirect langsung
    const user = getUser();
    if (getToken() && user) {
      const map = { mahasiswa: 'mahasiswa.html', dosen: 'dosen.html', admin: 'admin.html' };
      window.location.href = map[user.role] || 'index.html';
    }

    // Handle submit
    const form = document.getElementById('login-form');
    const btn  = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const deviceId = getDeviceId();

      try {
        const res = await fetch('http://localhost:3000/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Device-ID': deviceId
          },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          setToken(data.data.access_token);
          setRefreshToken(data.data.refresh_token);
          setUser({
            username: data.data.username,
            nama: data.data.nama,
            role: data.data.role
          });

          const map = { mahasiswa: 'mahasiswa.html', dosen: 'dosen.html', admin: 'admin.html' };
          window.location.href = map[data.data.role] || 'index.html';
        } else {
          errEl.textContent = data.error || 'Login gagal. Periksa username dan password.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Masuk';
        }
      } catch (err) {
        errEl.textContent = 'Tidak dapat terhubung ke server. Pastikan gateway berjalan.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
